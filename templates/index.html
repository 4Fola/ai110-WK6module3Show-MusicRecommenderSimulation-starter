<!-- templates/index.html -->
<!-- [Doc §Phase 2 – Step 4] Input → Process → Output; simple Bootstrap UI. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>VibeCraft 1.0 | Music Recommender</title>
    <!-- Proper CSS links (fixes white/blank page risk from malformed head) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="mb-3">VibeCraft 1.0</h1>
      <p class="text-muted mb-4">Local content‑based recommender (no external APIs).</p>

      <!-- Correct opening form tag (previously missing) -->
      <form method="get" action="/recommend" class="row g-3">

        <div class="col-md-3">
          <label class="form-label">Favorite Genre</label>
          <select name="favorite_genre" class="form-select">
            <option value="">(any)</option>
            {% for g in genres %}
              <option value="{{ g }}" {% if prefs.favorite_genre == g %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">Favorite Mood</label>
          <select name="favorite_mood" class="form-select">
            <option value="">(any)</option>
            {% for m in moods %}
              <option value="{{ m }}" {% if prefs.favorite_mood == m %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label">Target Energy (0–1)</label>
          <input class="form-control" type="number" step="0.01" min="0" max="1"
                 name="target_energy" value="{{ prefs.target_energy }}">
        </div>

        <div class="col-md-2">
          <label class="form-label">Target Tempo (BPM)</label>
          <input class="form-control" type="number" min="40" max="200"
                 name="target_tempo_bpm" value="{{ prefs.target_tempo_bpm }}">
        </div>

        <div class="col-md-2">
          <label class="form-label">Top‑K</label>
          <input class="form-control" type="number" min="1" max="20" name="top_k" value="{{ top_k }}">
        </div>

        <div class="col-md-6">
          <label class="form-label">Desired Mood Tags (comma‑separated)</label>
          <input class="form-control" name="desired_mood_tags"
                 value="{{ (prefs.desired_mood_tags | join(', ')) if prefs.desired_mood_tags else '' }}"
                 placeholder="e.g., anthem, euphoric, groove">
        </div>

        <div class="col-md-3">
          <label class="form-label">Scoring Mode</label>
          <select class="form-select" name="mode">
            <option value="balanced" {% if mode=='balanced' %}selected{% endif %}>Balanced</option>
            <option value="genre_first" {% if mode=='genre_first' %}selected{% endif %}>Genre‑First</option>
            <option value="mood_first" {% if mode=='mood_first' %}selected{% endif %}>Mood‑First</option>
            <option value="energy_focused" {% if mode=='energy_focused' %}selected{% endif %}>Energy‑Focused</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">Diversity</label>
          <select class="form-select" name="diversity">
            <option value="True"  {% if diversity %}selected{% endif %}>On</option>
            <option value="False" {% if not diversity %}selected{% endif %}>Off</option>
          </select>
        </div>

        <div class="col-12">
          <button class="btn btn-primary">Recommend</button>
        </div>
      </form>

      {% if results %}
        <hr class="my-4">
        <h4>Recommendations</h4>
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr><th>#</th><th>Title</th><th>Artist</th><th>Score</th><th>Reasons</th></tr>
            </thead>
            <tbody>
              {% for r in results %}
                <tr>
                  <td>{{ loop.index }}</td>
                  <td>{{ r.title }}</td>
                  <td>{{ r.artist }}</td>
                  <td>{{ '%.3f'|format(r.score) }}</td>
                  <td>{{ '; '.join(r.reasons) }}</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      {% endif %}
    </div>

    <!-- Optional JS (not required for rendering) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
